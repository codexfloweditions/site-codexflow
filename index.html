<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodexFlow Éditions</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ffffff; /* Fond blanc propre */
            color: #1e293b; /* Texte sombre */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 450px;
            width: 100%;
            text-align: center;
        }
        .logo {
            max-width: 150px; /* Taille ajustable de votre logo */
            height: auto;
            margin-bottom: 20px;
            border-radius: 8px;
        }
        h1 {
            font-size: 1.8rem;
            margin: 5px 0;
            color: #0f172a;
            font-weight: 800;
        }
        .subtitle {
            color: #64748b;
            font-size: 0.95rem;
            margin-bottom: 35px;
            font-weight: 500;
        }
        .link-btn {
            display: block;
            background-color: #f1f5f9; /* Boutons gris clair élégants */
            color: #0f172a;
            text-decoration: none;
            padding: 16px 20px;
            margin-bottom: 16px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            font-weight: 600;
            font-size: 1.05rem;
            transition: all 0.2s ease;
        }
        .link-btn:hover {
            background-color: #0f172a; /* Devient noir au survol */
            color: #ffffff;
            transform: translateY(-2px);
            border-color: #0f172a;
        }
        footer {
            margin-top: 40px;
            font-size: 0.85rem;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="logo.png" alt="CodexFlow Éditions" class="logo">
        
        <h1>CodexFlow Éditions</h1>
        <div class="subtitle">SF • Thriller • Romance • Fantasy</div>

        <a href="https://shop.codexflow.net" class="link-btn" target="_blank">🛒 Notre Boutique Officielle (Papiers & Objets)</a>
        <a href="https://ebook.codexflow.net" class="link-btn" target="_blank">📱 Boutique E-books & Numérique</a>
        <a href="https://codexflow.substack.com" class="link-btn" target="_blank">📖 Notre Veille Littéraire & Actus (Substack)</a>

        <footer>
            &copy; 2026 CodexFlow Éditions. Tous droits réservés.
        </footer>
    </div>

</body>
</html>
