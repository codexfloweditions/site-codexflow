<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodexFlow Éditions</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        .logo-placeholder {
            font-size: 3rem;
            margin-bottom: 10px;
        }
        h1 {
            font-size: 2.2rem;
            margin: 5px 0;
            color: #38bdf8;
            font-weight: 800;
            letter-spacing: -0.5px;
        }
        .subtitle {
            color: #94a3b8;
            font-size: 1rem;
            margin-bottom: 35px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .link-btn {
            display: block;
            background-color: #1e293b;
            color: #f8fafc;
            text-decoration: none;
            padding: 16px 20px;
            margin-bottom: 16px;
            border-radius: 12px;
            border: 1px solid #334155;
            font-weight: 600;
            font-size: 1.05rem;
            transition: all 0.25s ease;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .link-btn:hover {
            background-color: #38bdf8;
            color: #0f172a;
            transform: translateY(-3px);
            box-shadow: 0 10px 15px -3px rgba(56, 189, 248, 0.2);
            border-color: #38bdf8;
        }
        footer {
            margin-top: 40px;
            font-size: 0.85rem;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo-placeholder">🌌</div>
        <h1>CodexFlow Éditions</h1>
        <div class="subtitle">SF • Thriller • Romance • Fantasy</div>

        <!-- VOS LIENS PRINCIPAUX -->
        <a href="https://codexflow.substack.com" class="link-btn" target="_blank">📖 Notre Veille Littéraire & Actus (Substack)</a>
        
        <!-- Vous pourrez remplacer le # par les vrais liens de vos boutiques plus tard -->
        <a href="#" class="link-btn" target="_blank">🛍️ Découvrir nos Livres & Revues</a>
        <a href="#" class="link-btn" target="_blank">✨ Univers & Artisanat</a>

        <footer>
            &copy; 2026 CodexFlow Éditions. Tous droits réservés.
        </footer>
    </div>

</body>
</html>
